<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt</title>
</head>
<body>
    <div class="main-div">
        <div class="notify-content">

        </div> <br> 
        <form class="main-form">

            <label for="value-input">Input: <input type="text" name="value" id="value-input"></label> <br> <br>
            
            <button type="submit">Submit</button>
        </form>
    </div>
    <script>
        const form = document.querySelector(".main-form");
        const notify = document.querySelector(".notify-content");
        notify.innerHTML = "";

        form.addEventListener("submit",(e)=>{
            e.preventDefault();

            const {value} = Object.fromEntries(new FormData(form));

            notify.innerHTML = `<h3>You said: ${value}</h3>`;
        })
    </script>
</body>
</html>
